      const node = state.nodeIndex?.get(String(step.node_id))
      const runtime = node ? nodeRuntime(node) : ''
      const kindLabel = `${kindNames[step.kind] || step.kind}${runtime && runtime !== (kindNames[step.kind] || step.kind) ? ` · ${runtime}` : ''}`
      const childRun = step.details?.subflow_run_id || null
      return `<details class="step" data-path="${esc(step.path)}" ${shouldOpen ? 'open' : ''}>
        <summary>
          <span class="step-seq">${String(step.seq).padStart(2, '0')}</span>
          <span class="step-label">${esc(step.label || step.node_id)}</span>
          <span class="step-kind" title="运行方式：${esc(runtime || kindLabel)}">${esc(kindLabel)}</span>
          ${badge(step.status)}<span class="step-duration">${esc(duration(step))}</span>
        </summary>
        <div class="step-body">
          <div class="step-def"><button class="btn btn-small" type="button" data-step-def="${esc(step.node_id)}">查看节点定义</button>
            ${childRun ? `<button class="btn btn-small btn-primary" type="button" data-open-run="${esc(childRun)}">进入子流程 →</button>` : ''}</div>
          <div class="step-path">${esc(step.path)}</div>
          <div class="io-grid">
            <div class="io-block"><div class="io-title">输入 Cin</div><pre>${esc(pretty(step.input))}</pre></div>
            <div class="io-block"><div class="io-title">输出 Cout</div><pre>${esc(step.status === 'waiting_human' ? '等待人工输入…' : step.status === 'running' ? '执行中…' : pretty(step.output))}</pre></div>
          </div>
          ${step.error ? `<div class="error-box"><div class="io-title">错误</div><pre>${esc(pretty(step.error))}</pre></div>` : ''}
          ${step.details ? `<div class="details-box"><div class="io-title">执行详情</div><pre>${esc(pretty(step.details))}</pre></div>` : ''}
        </div>
      </details>`
    }

    function renderEntryContract(run) {
      if (!run?.definition) return ''
      const inputs = run.definition.inputs
      const rows = Object.entries(inputs || {})
      const meta = spec => {
        const parts = [spec.required ? '必填' : '可选']
        if (spec.judge === 'llm') parts.push('LLM 解析')
        if (Object.prototype.hasOwnProperty.call(spec, 'default')) parts.push(`默认 ${JSON.stringify(spec.default)}`)
        if (Array.isArray(spec.enum)) parts.push(`枚举 ${spec.enum.map(value => JSON.stringify(value)).join('/')}`)
        if (typeof spec.min === 'number') parts.push(`min ${spec.min}`)
        if (typeof spec.max === 'number') parts.push(`max ${spec.max}`)
        return parts.join(' · ')
      }
      return `<section class="entry-card">
        <h4>入口契约 ${rows.length ? `· ${rows.length} 个字段` : '· 未声明'}</h4>
        <div class="entry-list">${rows.map(([name, spec]) => `<div class="entry-row">
          <span class="entry-name">${esc(name)}</span>
          <span class="entry-type">${esc(spec.type)}</span>
          <span class="entry-meta">${esc(meta(spec))}</span>
          ${spec.description ? `<span class="entry-desc">${esc(spec.description)}</span>` : ''}
        </div>`).join('') || '<div class="entry-desc">definition.inputs 未声明：入口 Cin 按任意 JSON 传入。</div>'}</div>
        <form id="invoke-form" class="entry-form">
          <textarea id="invoke-input" spellcheck="false" placeholder='{"字段":"值"}'>${esc(state.invokeDraft || pretty(run.input ?? {}))}</textarea>
          <div class="form-footer"><span class="form-hint">${run.status === 'draft' && buildPlaceholders(run.definition).length ? '存在未构建的子流程占位，构建完成前不能运行。' : '直接按定义运行，不经过需求分析与规划；输入按契约校验后进入入口节点。'}</span>
          <button class="btn btn-primary btn-small" type="submit" ${state.submitting || (run.status === 'draft' && buildPlaceholders(run.definition).length) ? 'disabled' : ''}>直接运行</button></div>
        </form>
      </section>`
    }

    function renderWorkspace(run) {
      const session = state.session
      const value = session?.workspace || run?.workspace || ''
      const editable = Boolean(session)
      return `<section class="entry-card">
        <h4>工作目录</h4>
        <form id="workspace-form" class="entry-form">
          <input id="workspace-input" type="text" spellcheck="false" value="${esc(state.workspaceDraft ?? value)}" placeholder="留空使用会话默认目录（data_dir/workspaces/&lt;session_id&gt;）" ${editable ? '' : 'disabled'}>
          <div class="form-footer"><span class="form-hint">${editable ? 'script 节点默认在此目录执行，相对 cwd 以此为根；脚本文件读写都应限制在目录内。' : '该运行没有会话记录，工作目录只读。'}</span>
          ${editable ? `<button class="btn btn-small" type="submit" ${state.submitting ? 'disabled' : ''}>保存目录</button>` : ''}</div>
        </form>
      </section>`
    }

    function renderRepair(run) {
      const repair = run.repair_state
      if (!repair) return ''
      const status = repair.status
      const attempts = repair.attempts ?? (run.repairs || []).length
      const active = ['repairing', 'retrying'].includes(status)
      const title = status === 'repairing' ? `正在自动修复节点 ${repair.node_id || ''}`
        : status === 'retrying' ? `节点 ${repair.node_id || ''} 已修复，正在自动重跑`
          : status === 'repaired' ? `节点 ${repair.node_id || ''} 自动修复成功`
            : status === 'exhausted' ? '自动修复次数已用尽，转交人工确认'
              : '自动修复未生成有效结果，转交人工确认'
      return `<section class="notice ${active ? 'running' : (['failed', 'exhausted'].includes(status) ? 'failed' : '')}">
        <div class="notice-title">${active ? '<span class="spinner"></span>' : ''}${esc(title)} ${badge(status)}</div>
        <p>已尝试 ${esc(attempts)} 次局部修复${repair.path ? ` · ${esc(repair.path)}` : ''}。只替换失败节点，保留其他节点和运行版本链。</p>
        ${repair.error ? `<small>${esc(repair.error)}</small>` : ''}
      </section>`
    }

    function renderNotice(run) {
      if (['waiting_human', 'paused'].includes(run.status) && run.pending) {
        return `<section class="notice waiting">
          <div class="notice-title">${run.status === 'paused' ? '人工节点已暂停' : '人工节点等待输入'} ${badge(run.status)}</div>
          <p>${esc(run.pending.prompt)}</p><small>${esc(run.pending.path)}</small>
          <form id="human-form" class="human-form">
            <label for="human-input">恢复输入（JSON）</label>
            <textarea id="human-input" spellcheck="false">${esc(state.draft)}</textarea>
            <div class="form-footer"><span class="form-hint">业务输入只注入原人工节点，不经过监督消息。</span><button class="btn btn-primary" type="submit" ${state.submitting ? 'disabled' : ''}>${state.submitting ? '正在恢复…' : '提交并继续'}</button></div>
          </form>
        </section>`
      }
      if (run.status === 'draft') {
        const placeholders = buildPlaceholders(run.definition)
        return `<section class="notice waiting"><div class="notice-title">工作流尚未启动 ${badge('draft')}</div><p>右栏是规划器生成的 IR 草稿。请在中栏确认“启动工作流”后才会执行节点。</p>
          ${placeholders.length ? `<div class="action-buttons"><button class="btn btn-primary" data-prebuild-run="${esc(run.id)}" ${state.submitting ? 'disabled' : ''}>预构建子流程（${placeholders.length}）</button></div>
          <p class="form-hint">含 ${placeholders.map(item => esc(item.label)).join('、')}。逐个创建子会话构建完成后才能启动执行。</p>` : ''}</section>`
      }
      if (run.status === 'plan_failed') {
        return `<section class="notice failed"><div class="notice-title">规划失败 ${badge('plan_failed')}</div><p>${esc(run.error?.message || run.planner?.error || '未知错误')}</p><small>未创建工作流定义，也未执行任何业务节点。</small></section>`
      }
      if (run.status === 'paused') {
        return `<section class="notice waiting"><div class="notice-title">工作流已暂停 ${badge('paused')}</div><p>轨迹已保留，可从当前稳定边界继续重放。</p><div class="action-buttons"><button class="btn btn-primary" data-resume-run="${esc(run.id)}" ${state.submitting ? 'disabled' : ''}>继续执行</button></div></section>`
      }
      if (run.status === 'failed') {
        if (run.repair_state?.status === 'repairing') return ''
        return `<section class="notice failed"><div class="notice-title">运行失败 ${badge('failed')}</div><p>${esc(run.error?.message || '未知错误')}</p><small>${esc(run.error?.path || '')}</small>
          <div class="action-buttons"><button class="btn btn-primary" data-invoke-run="${esc(run.id)}" ${state.submitting ? 'disabled' : ''}>重试运行</button></div></section>`
      }
      if (run.status === 'running') {
        if (run.repair_state?.status === 'retrying') return ''
        return `<section class="notice running"><div class="notice-title"><span class="spinner"></span>正在执行 ${esc(run.current?.label || run.current?.node_id || '')}</div><p>业务按 IR 节点顺序推进，每个节点完成后都会持久化。</p></section>`
      }
      if (run.status === 'completed') {
        return `<section class="notice"><div class="notice-title">运行完成 ${badge('completed')}</div><p>最终 Cout</p><pre>${esc(pretty(run.output))}</pre></section>`
      }
      if (run.status === 'cancelled') {
        return `<section class="notice failed"><div class="notice-title">工作流已终止 ${badge('cancelled')}</div><p>既有轨迹保持不变，不再推进任何节点。</p></section>`
      }
      if (run.status === 'superseded') {
        return `<section class="notice"><div class="notice-title">历史版本 ${badge('superseded')}</div><p>此版本已被 ${esc(run.superseded_by || '新版本')} 替代，原轨迹仅供审计。</p></section>`
      }
      return ''
    }

    function renderRunEvents(run) {
      const names = { start: '创建工作流', wait: '等待人工输入', resume: '注入人工输入', done: '运行完成', fail: '运行失败' }
      const events = runEvents([run]).reverse()
      return `<details class="event-log" id="run-events" ${state.eventsOpen ? 'open' : ''}><summary>运行事件（${events.length}）</summary><div class="event-list">
        ${events.map(event => `<div class="event-item"><span class="event-time">${esc(shortTime(event.at))}</span><div><strong>${esc(names[event.kind] || event.kind)}</strong>${event.kind === 'wait' ? `<p>${esc(event.step.prompt || '')}</p>` : ''}${event.kind === 'fail' ? `<p>${esc(run.error?.message || '')}</p>` : ''}</div></div>`).join('') || '<div class="session-empty">暂无运行事件</div>'}
      </div></details>`
    }

    function renderRunParent(run) {
      if (!run?.parent_run_id) return ''
      return `<section class="notice">
        <div class="notice-title">子流程运行 ${badge(run.status)}</div>
        <p>隶属父运行 ${esc(run.parent_run_id)} · 节点 ${esc(run.parent_node_id || '—')}${run.parent_path ? ` · ${esc(run.parent_path)}` : ''}</p>
        <div class="action-buttons"><button class="btn btn-small" type="button" data-open-run="${esc(run.parent_run_id)}">← 返回父运行（Alt+←）</button></div>
      </section>`
    }

    function renderTrace() {
      const run = state.run
      if (!run) {
        state.definition = null
        state.dagDefinition = null
        state.nodeIndex = null
        $('#trace-sub').textContent = '—'
        $('#trace-body').innerHTML = '<div class="empty"><div>选择一个运行查看 DAG、步骤 Cin/Cout 与运行事件</div></div>'
        $('#trace-rail').innerHTML = '<span class="rail-label">运行轨迹</span>'
        applyLayout()
        return
      }
      const preview = state.sessionActions.find(action => action.id === state.previewActionId && action.draft?.definition)
      const graphRun = preview ? { ...run, definition: preview.draft.definition, trace: [], current: null, status: 'draft' } : run
      state.definition = run.definition || null
      state.dagDefinition = graphRun.definition || null
      state.nodeIndex = indexDefinition(state.definition)
      $('#trace-sub').textContent = `${run.name} · v${run.definition_version || 1} · ${run.trace.length} 条节点记录 · fuel ${run.fuel?.remaining ?? '—'}/${run.fuel?.initial ?? '—'}${firstSubflowRun(run) ? ' · Alt+→ 进入子流程' : ''}`
      const railStatus = run.current && run.status === 'running' ? 'running' : run.status
      $('#trace-rail').innerHTML = `
        <span class="rail-label">运行轨迹</span>
        <span class="dot ${esc(railStatus)}"></span>
        <span class="rail-node" title="${esc(run.current?.label || run.name)}">${esc(run.current?.label || statusNames[run.status] || '')}</span>`
      $('#trace-body').innerHTML = `
        ${preview ? `<section class="notice preview-note"><div class="notice-title">待确认版本预览</div><p>${esc(preview.draft.summary || actionNames[preview.type] || preview.type)}</p><small>仅预览 DAG，尚未执行。下方步骤仍属于当前实际运行。</small></section>` : ''}
        ${renderRunParent(run)}
        ${renderRepair(run)}
        ${renderNotice(run)}
        ${renderEntryContract(run)}
        ${renderWorkspace(run)}
        <div class="section-title"><h3>${preview ? '新定义预览' : '流程状态'}</h3><span>DAG</span></div>
        <div class="legend">
          <span><i class="dot completed"></i>已完成</span>
          <span><i class="dot waiting_human"></i>等待人工</span>
          <span><i class="dot running"></i>执行中</span>
          <span><i class="dot failed"></i>失败</span>
          <span><i class="dot"></i>未执行</span>
        </div>
        ${renderDag(graphRun) || '<div class="session-empty">没有可预览的工作流定义</div>'}
        <div class="section-title"><h3>实际步骤输入输出</h3><span>Cin / Cout · 点击展开</span></div>
        <div class="steps">${run.trace.map((step, index, steps) => renderStep(step, index, steps)).join('') || '<div class="session-empty">还没有实际步骤记录</div>'}</div>
        ${renderRunEvents(run)}`
      applyLayout()
    }

    async function refresh() {
      if (state.refreshing) return
      state.refreshing = true
      const focus = captureFocus()
      try {
        const list = await api('/api/sessions')
        state.sessions = list.sessions || []
        if (!state.sessions.some(session => session.id === state.selectedSessionId)) {
          state.selectedSessionId = state.sessions[0]?.id || null
          state.selectedRunId = null
          state.session = null
          state.children = []
          state.run = null
          state.draft = '{}'
          state.previewActionId = null
          state.openPaths.clear()
        }
        if (!state.selectedSessionId) {
          state.session = null
          state.mail = null
          state.children = []
          state.sessionRuns = []
          state.sessionMessages = []
          state.sessionActions = []
          state.run = null
          renderSessions()
          renderOverview()
          renderSession()
          renderTrace()
          restoreFocus(focus)
          return
        }
        const [detail, mailbox] = await Promise.all([
          api(`/api/sessions/${encodeURIComponent(state.selectedSessionId)}`),
          api(`/api/sessions/${encodeURIComponent(state.selectedSessionId)}/mail`).catch(() => null),
        ])
        state.session = detail.session
        state.build = detail.build || null
        state.buildStack = detail.build_stack || null
        state.children = detail.children || []
        state.mail = mailbox
        state.sessionRuns = detail.runs
        state.sessionMessages = detail.messages
        state.sessionActions = detail.actions
        if (!state.selectedRunId || !detail.runs.some(run => run.id === state.selectedRunId)) {
          state.selectedRunId = state.session.active_run_id || state.session.draft_run_id || detail.runs[0]?.id || null
        }
        state.run = state.selectedRunId ? await api(`/api/runs/${state.selectedRunId}`) : null
        if (!state.run) state.draft = '{}'
        if (state.previewActionId && !detail.actions.some(action => action.id === state.previewActionId)) state.previewActionId = null
        renderSessions()
        renderOverview()
        renderSession()
        renderTrace()
        restoreFocus(focus)
      } catch (error) {
        toast(error.message)
      } finally {
        state.refreshing = false
      }
    }

    function selectSession(sessionId) {
      if (sessionId === state.selectedSessionId) return
      state.selectedSessionId = sessionId
      state.selectedRunId = null
      state.session = null
      state.build = null
      state.buildStack = null
      state.mail = null
      state.children = []
      state.sessionRuns = []
      state.sessionMessages = []
      state.sessionActions = []
      state.run = null
      state.draft = '{}'
      state.answerDraft = ''
      state.reviseDraft = ''
      state.dagReviseDraft = ''
      state.invokeDraft = ''
      state.workspaceDraft = null
      state.previewActionId = null
      state.openPaths.clear()
      renderSessions()
      renderOverview()
      renderSession()
      renderTrace()
      refresh()
    }

    function selectRunView(runId) {
      state.selectedRunId = runId
      state.previewActionId = null
      state.invokeDraft = ''
      state.workspaceDraft = null
      state.openPaths.clear()
      refresh()
    }

    function setBusy(value) {
      state.submitting = value
      $('#new-plan').disabled = value
      $('#plan-submit').disabled = value
      $('#supervise-submit').disabled = value
      renderOverview()
      renderTrace()
    }

    function togglePlan(show) {
      const form = $('#plan-form')
      form.hidden = typeof show === 'boolean' ? !show : !form.hidden
      if (!form.hidden) {
        $('#plan-task').focus()
      }
    }

    $('#groups').addEventListener('click', event => {
      const toggle = event.target.closest('[data-tree-toggle]')
      if (toggle) {
        const id = toggle.dataset.treeToggle
        if (state.collapsedSessions.has(id)) state.collapsedSessions.delete(id)
        else state.collapsedSessions.add(id)
        localStorage.setItem('flowCollapsedSessions', JSON.stringify([...state.collapsedSessions]))
        renderSessions()
        return
      }
      const card = event.target.closest('[data-session-id]')
      if (card) selectSession(card.dataset.sessionId)
    })
    $('#new-plan').addEventListener('click', () => togglePlan())
    $('#close-plan').addEventListener('click', () => togglePlan(false))
    $('#overview').addEventListener('click', async event => {
      const openSession = event.target.closest('[data-open-session]')
      if (openSession) {
        selectSession(openSession.dataset.openSession)
        return
      }
      const startBuild = event.target.closest('[data-start-build]')
      if (startBuild) {
        await runBuildGate('start-build', startBuild.dataset.startBuild, startBuild)
        return
      }
      const confirmDag = event.target.closest('[data-confirm-dag]')
      if (confirmDag) {
        await runBuildGate('confirm-dag', confirmDag.dataset.confirmDag, confirmDag)
        return
      }
      const retryBuild = event.target.closest('[data-retry-build]')
      if (retryBuild) {
        await runBuildGate('retry-build', retryBuild.dataset.retryBuild, retryBuild)
        return
      }
      const acceptBuild = event.target.closest('[data-accept-build]')
      if (acceptBuild) {
        await runBuildGate('accept-build', acceptBuild.dataset.acceptBuild, acceptBuild)
        return
      }
      const buildDagNode = event.target.closest('[data-build-dag-def]')
      if (buildDagNode) {
        openNodeDefinition(buildDagNode.dataset.buildDagDef, 'build-dag')
        return
      }
      if (event.target.closest('[data-open-plan]')) {
        togglePlan(true)
        return
      }
      const viewRun = event.target.closest('[data-view-run]')
      if (viewRun) {
        selectRunView(viewRun.dataset.viewRun)
        return
      }
      const evaluate = event.target.closest('[data-evaluate-session]')
      if (evaluate && !state.submitting) {
        if (!state.selectedSessionId) { toast('请先选择一个会话'); return }
        setBusy(true)
        try {
          await api(`/api/sessions/${encodeURIComponent(state.selectedSessionId)}?action=evaluate`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
          })
          await refresh()
        } catch (error) {
          toast(error.message)
          await refresh()
        } finally {
          setBusy(false)
        }
        return
      }
      const preview = event.target.closest('[data-preview-action]')
      if (preview) {
        state.previewActionId = preview.dataset.previewAction
        renderTrace()
        return
      }
      const prebuild = event.target.closest('[data-prebuild-run]')
      if (prebuild) {
        await prebuildRun(prebuild.dataset.prebuildRun, prebuild)
        return
      }
      const button = event.target.closest('[data-confirm-action]')
      if (!button || state.submitting) return
      const runId = button.dataset.actionRun
      const actionId = button.dataset.confirmAction
      const approved = button.dataset.approved === 'true'
      setBusy(true)
      try {
        const result = await api(`/api/runs/${runId}?action=confirm`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action_id: actionId, approved }),
        })
        state.selectedRunId = result.id
        state.previewActionId = null
        await refresh()
      } catch (error) {
        toast(error.message)
        await refresh()
      } finally {
        setBusy(false)
      }
    })
    $('#overview').addEventListener('input', event => {
      if (event.target.id === 'answer-input') state.answerDraft = event.target.value
      else if (event.target.id === 'revise-input') state.reviseDraft = event.target.value
      else if (event.target.id === 'dag-revise-input') state.dagReviseDraft = event.target.value
    })
    $('#overview').addEventListener('submit', async event => {
      if (!state.selectedSessionId || state.submitting) return
      if (event.target.id === 'answer-form') {
        event.preventDefault()
        const answer = state.answerDraft.trim()
        if (!answer) { toast('回答不能为空'); return }
        setBusy(true)
        const button = event.target.querySelector('button[type="submit"]')
        const stopProgress = button ? startProgress(button, '正在处理回答', '提交回答') : null
        try {
          await api(`/api/sessions/${encodeURIComponent(state.selectedSessionId)}?action=answer`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answer }),
          })
          state.answerDraft = ''
          await refresh()
        } catch (error) {
          toast(error.message)
        } finally {
          if (stopProgress) stopProgress()
          setBusy(false)
        }
        return
      }
      if (event.target.id === 'dag-revise-form') {
        event.preventDefault()
        const instruction = state.dagReviseDraft.trim()
        if (!instruction) { toast('修改意见不能为空'); return }
        setBusy(true)
        const button = event.target.querySelector('button[type="submit"]')
        const stopProgress = button ? startProgress(button, '正在重新生成 DAG', '提交意见并重新生成 DAG') : null
        try {
          await api(`/api/sessions/${encodeURIComponent(state.selectedSessionId)}?action=revise`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instruction }),
          })
          state.dagReviseDraft = ''
          await refresh()
          toast('已按意见重新生成 DAG，请再次确认')
        } catch (error) {
          toast(error.message)
        } finally {
          if (stopProgress) stopProgress()
          setBusy(false)
        }
        return
      }
      if (event.target.id === 'revise-form') {
        event.preventDefault()
        const instruction = state.reviseDraft.trim()
        if (!instruction) { toast('修订说明不能为空'); return }
        setBusy(true)
        const button = event.target.querySelector('button[type="submit"]')
        const stopProgress = button ? startProgress(button, '正在重新规划', '提交修订') : null
        try {
          await api(`/api/sessions/${encodeURIComponent(state.selectedSessionId)}?action=revise`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instruction }),
          })
          state.reviseDraft = ''
          await refresh()
        } catch (error) {
          toast(error.message)
        } finally {
          if (stopProgress) stopProgress()
          setBusy(false)
        }
      }
    })
    $('#plan-form').addEventListener('submit', async event => {
      event.preventDefault()
      if (state.submitting) return
      const task = $('#plan-task').value.trim()
      const name = $('#plan-name').value.trim()
      const rawInput = $('#plan-input').value.trim()
      if (!task) {
        toast('任务描述不能为空')
        return
      }
      const body = { task }
      if (name) body.name = name
      if (rawInput) {
        try { body.input = JSON.parse(rawInput) } catch (error) { toast(`入口 Cin 不是合法 JSON：${error.message}`); return }
      }
      setBusy(true)
      let stopProgress = null
      try {
        stopProgress = startProgress($('#plan-submit'), '正在分析需求', '受理任务')
        const result = await api('/api/sessions', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        })
        state.selectedSessionId = result.session.id
        state.selectedRunId = result.session.active_run_id || result.session.draft_run_id || null
        state.session = null
        state.run = null
        state.previewActionId = null
        state.openPaths.clear()
        togglePlan(false)
        if (result.session.status === 'clarifying') {
          toast('信息不足，已在会话中提出澄清问题')
        } else if (result.session.status === 'plan_failed') {
          toast('规划未通过校验，未启动任何节点；可查看失败原因')
        }
        if (result.session.status !== 'clarifying') {
          $('#plan-task').value = ''
          $('#plan-name').value = ''
          $('#plan-input').value = ''
        }
        await refresh()
      } catch (error) {
        toast(error.message)
      } finally {
        if (stopProgress) stopProgress()
        $('#plan-submit').textContent = '受理任务'
        setBusy(false)
      }
    })
    $('#supervise-form').addEventListener('submit', async event => {
      event.preventDefault()
      if (state.submitting) return
      if (!state.run) {
        toast('请先选择一个运行')
        return
      }
      const runId = state.run.id
      const instruction = $('#supervise-input').value.trim() || '请分析当前运行状态，判断是否需要干预'
      const session = state.session
      const preExecution = session && ['intake', 'clarifying', 'planning', 'plan_failed', 'awaiting_confirm'].includes(session.status)
      setBusy(true)
      let stopProgress = null
      try {
        if (preExecution) {
          stopProgress = startProgress($('#supervise-submit'), '正在重新规划', '监督分析')
          await api(`/api/sessions/${encodeURIComponent(session.id)}?action=revise`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instruction }),
          })
        } else {
          stopProgress = startProgress($('#supervise-submit'), '正在监督分析', '监督分析')
          await api(`/api/runs/${runId}?action=supervise`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ instruction }),
          })
        }
        $('#supervise-input').value = ''
        await refresh()
      } catch (error) {
        toast(error.message)
      } finally {
        if (stopProgress) stopProgress()
        $('#supervise-submit').textContent = '监督分析'
        setBusy(false)
      }
    })
    $('#refresh').addEventListener('click', refresh)
    $('#toggle-trace').addEventListener('click', () => {
      state.collapsed = !state.collapsed
      localStorage.setItem('flowTraceCollapsed', state.collapsed ? '1' : '0')
      $('#toggle-trace').textContent = state.collapsed ? '展开' : '收起'
      applyLayout()
    })
    $('#trace-rail').addEventListener('click', () => {
      state.collapsed = false
      localStorage.setItem('flowTraceCollapsed', '0')
      $('#toggle-trace').textContent = '收起'
      applyLayout()
    })
    $('#trace-body').addEventListener('toggle', event => {
      if (event.target.id === 'run-events') {
        state.eventsOpen = event.target.open
        return
      }
      if (!event.target.matches('details.step')) return
      if (event.target.open) state.openPaths.add(event.target.dataset.path)
      else state.openPaths.delete(event.target.dataset.path)
    }, true)
    $('#trace-body').addEventListener('input', event => {
      if (event.target.id === 'human-input') state.draft = event.target.value
      if (event.target.id === 'invoke-input') state.invokeDraft = event.target.value
      if (event.target.id === 'workspace-input') state.workspaceDraft = event.target.value
    })
    $('#trace-body').addEventListener('keydown', event => {
      if (event.key !== 'Enter' && event.key !== ' ') return
      const dagNode = event.target.closest('[data-dag-def]')
      if (!dagNode) return
      event.preventDefault()
      openDagNode(dagNode.dataset.dagDef)
    })
    $('#trace-body').addEventListener('click', async event => {
      const dagDef = event.target.closest('[data-dag-def]')
      if (dagDef) { openDagNode(dagDef.dataset.dagDef); return }
      const openRun = event.target.closest('[data-open-run]')
      if (openRun) { selectRunView(openRun.dataset.openRun); return }
      const stepDef = event.target.closest('[data-step-def]')
      if (stepDef) { openNodeDefinition(stepDef.dataset.stepDef, 'run'); return }
      const prebuild = event.target.closest('[data-prebuild-run]')
      if (prebuild) {
        await prebuildRun(prebuild.dataset.prebuildRun, prebuild)
        return
      }
      const invokeRun = event.target.closest('[data-invoke-run]')
      if (invokeRun && !state.submitting) {
        setBusy(true)
        try {
          const result = await api(`/api/runs/${invokeRun.dataset.invokeRun}?action=invoke`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
          })
          state.selectedRunId = result.id
          await refresh()
          toast('已按同一份定义重新运行')
        } catch (error) {
          toast(error.message)
        } finally {
          setBusy(false)
        }
        return
      }
      const button = event.target.closest('[data-resume-run]')
      if (!button || state.submitting) return
      const runId = button.dataset.resumeRun
      setBusy(true)
      try {
        await api(`/api/runs/${runId}?action=resume`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
        })
        await refresh()
      } catch (error) {
        toast(error.message)
      } finally {
        setBusy(false)
      }
    })
    $('#trace-body').addEventListener('submit', async event => {
      if (event.target.id === 'workspace-form') {
        event.preventDefault()
        if (state.submitting) return
        const sessionId = state.session?.id
        if (!sessionId) { toast('当前运行没有会话记录'); return }
        const workspace = $('#workspace-input').value.trim()
        setBusy(true)
        try {
          await api(`/api/sessions/${sessionId}?action=workspace`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(workspace ? { workspace } : {}),
          })
          state.workspaceDraft = null
          toast('工作目录已更新')
          await refresh()
        } catch (error) {
          toast(error.message)
        } finally {
          setBusy(false)
        }
        return
      }
      if (event.target.id === 'invoke-form') {
        event.preventDefault()
        if (state.submitting) return
        const runId = state.run?.id
        if (!runId) { toast('请先选择一个运行'); return }
        const text = $('#invoke-input').value.trim()
        let input
        if (text) {
          try { input = JSON.parse(text) } catch (error) { toast(`入口输入不是合法 JSON：${error.message}`); return }
        }
        setBusy(true)
        try {
          const result = await api(`/api/runs/${runId}?action=invoke`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(input === undefined ? {} : { input }),
          })
          state.invokeDraft = ''
          state.openPaths.clear()
          state.selectedRunId = result.id
          toast(`已直接运行：${result.id}`)
          await refresh()
        } catch (error) {
          toast(error.message)
        } finally {
          setBusy(false)
        }
        return
      }
      if (event.target.id !== 'human-form') return
      event.preventDefault()
      if (state.submitting) return
      let input
      try { input = JSON.parse(state.draft) } catch (error) { toast(`恢复输入不是合法 JSON：${error.message}`); return }
      const runId = state.run?.id
      if (!runId) { toast('请先选择一个运行'); return }
      setBusy(true)
      try {
        await api(`/api/runs/${runId}?action=resume`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ input }),
        })
        state.draft = '{}'
        state.openPaths.clear()
        await refresh()
      } catch (error) {
        toast(error.message)
      } finally {
        setBusy(false)
      }
    })
    $('#toggle-trace').textContent = state.collapsed ? '展开' : '收起'
    $('#def-close').addEventListener('click', closeNodeDefinition)
    $('#def-copy').addEventListener('click', async () => {
      if (!state.selectedNode) return
      try {
        await navigator.clipboard.writeText(JSON.stringify(state.selectedNode, null, 2))
        toast('节点定义已复制')
      } catch (error) {
        toast(`复制失败：${error.message}`)
      }
    })
    $('#def-modal').addEventListener('click', event => {
      if (event.target.id === 'def-modal') closeNodeDefinition()
    })
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !$('#def-modal').hidden) { closeNodeDefinition(); return }
      if (!event.altKey || event.target?.closest?.('input, textarea, [contenteditable="true"]')) return
      if (event.key === 'ArrowLeft') {
        if (state.run?.parent_run_id) {
          event.preventDefault()
          selectRunView(state.run.parent_run_id)
        } else if (state.session?.parent_session_id) {
          event.preventDefault()
          selectSession(state.session.parent_session_id)
        }
        return
      }
      if (event.key === 'ArrowRight') {
        const child = firstSubflowRun(state.run)
        if (child) {
          event.preventDefault()
          toast(`进入子流程 ${child}`)
          selectRunView(child)
        } else if (state.children?.length) {
          event.preventDefault()
          selectSession(state.children[0].id)
        }
      }
    })
    applyLayout()
    renderOverview()
    renderSession()
    renderTrace()
    refresh()
    setInterval(() => {
      if (document.hidden || state.submitting) return
      const active = document.activeElement
      if (active && ['human-input', 'answer-input', 'revise-input', 'dag-revise-input', 'invoke-input', 'workspace-input'].includes(active.id)) return
      refresh()
    }, 3000)
  </script>
</body>
</html>
